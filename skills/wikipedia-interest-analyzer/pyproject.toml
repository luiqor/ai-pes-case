[project]
name = "wikipedia-interest-analyzer"
version = "0.1.0"
description = "Analyze Wikipedia pageview data: resolve topics to articles, fetch views, compute trends, chart, and produce a one-page report."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "reportlab>=4.2",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# This is a script collection, not an installable library.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
