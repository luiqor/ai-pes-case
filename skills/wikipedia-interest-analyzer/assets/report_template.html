<!DOCTYPE html>
<html lang="$html_lang">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
  @page { size: Letter; margin: 12mm; }
  :root {
    /* Swiss palette: black on white, greys, and one rationed red. */
    --ink: #111111; --muted: #666666; --rule: #d0d0d0;
    --accent: #e30613;
    --up: #127a3e; --down: #b3261e; --flat: #6b7785;
    --gap-fg: #a11111; --gap-bg: #fdf4f4;
    --paper: #ffffff; --stage: #f0f0f0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink); margin: 0; padding: 16px 12mm;
    font-size: 10.5pt; line-height: 1.45; background: var(--stage);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page {
    max-width: 190mm; margin: 0 auto; background: var(--paper);
    border: 1pt solid var(--rule);
  }

  /* ---- masthead: flush left, letterspaced red kicker, one red rule ---- */
  header { padding: 14pt 14pt 10pt; border-bottom: 3pt solid var(--accent); }
  .kicker {
    font-size: 7.5pt; font-weight: 700; letter-spacing: 1.8pt;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6pt;
  }
  h1 {
    font-size: 24pt; margin: 0 0 5pt; line-height: 1.06;
    letter-spacing: -0.4pt; font-weight: 700;
  }
  .subtitle { font-size: 8.5pt; color: var(--muted); }

  main { padding: 12pt 14pt 0; }

  /* ---- sections: rule + number, the grid's ornament ---- */
  .sec {
    border-top: 1pt solid var(--ink);
    padding-top: 5pt; margin-top: 10pt;
  }
  .sec-num {
    display: block; font-size: 8pt; font-weight: 700; letter-spacing: 1pt;
    color: var(--accent); margin-bottom: 3pt;
  }

  /* ---- verdict: red bar, outlined tag, hero number ---- */
  .verdict {
    display: flex; flex-wrap: wrap; gap: 6pt 16pt; align-items: flex-start;
    border: .75pt solid var(--ink); border-left: 4pt solid var(--accent);
    padding: 8pt 11pt 9pt; margin: 0 0 4pt;
  }
  .verdict-main { flex: 1 1 60%; min-width: 0; }
  .verdict-tag {
    display: inline-block; border: .75pt solid var(--accent);
    color: var(--accent); font-size: 6.5pt; font-weight: 700;
    letter-spacing: 1.2pt; text-transform: uppercase;
    padding: 1.5pt 6pt; margin-bottom: 5pt;
  }
  .verdict-text { font-size: 10.5pt; }
  .hero { flex: 0 0 auto; text-align: right; margin-left: auto; }
  .hero:empty { display: none; }
  .hero-rule {
    width: 46pt; height: 2.5pt; background: var(--accent);
    margin: 1pt 0 4pt auto;
  }
  .hero-num {
    font-size: 30pt; font-weight: 700; line-height: 1;
    letter-spacing: -0.5pt; font-variant-numeric: tabular-nums;
  }
  .hero-label {
    font-size: 6.5pt; font-weight: 700; letter-spacing: 1pt;
    text-transform: uppercase; margin-top: 4pt;
  }
  .hero-sub { font-size: 7.5pt; color: var(--muted); margin-top: 1pt; }

  /* ---- KPI tiles: fixed modules, so one language doesn't stretch ----- */
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 230px));
    gap: 8pt; margin: 8pt 0 4pt;
  }
  .tile {
    border: 1pt solid var(--rule); border-top: 3pt solid var(--series, var(--ink));
    padding: 7pt 8pt 6pt; background: #fff;
  }
  .tile-head {
    display: flex; justify-content: space-between; align-items: center; gap: 6pt;
  }
  .tile-lang {
    font-size: 8pt; font-weight: 700; letter-spacing: 1pt;
    color: var(--series, var(--ink)); text-transform: uppercase;
  }
  .tile-badges { display: inline-flex; align-items: center; gap: 4pt; }
  .gauge { font-size: 8.5pt; letter-spacing: .5pt; line-height: 1; }
  .tile-title {
    font-size: 8pt; color: var(--muted); margin: 1pt 0 5pt;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile-hero { font-size: 17pt; font-weight: 700; line-height: 1.1; }
  .tile-hero.up { color: var(--up); }
  .tile-hero.down { color: var(--down); }
  .tile-hero.flat { color: var(--flat); }
  .tile-hero .arrow { font-size: 11pt; }
  .tile-hero-label {
    font-size: 6.5pt; font-weight: 700; letter-spacing: 1pt;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6pt;
  }
  .tile-stats { display: flex; gap: 10pt; margin-bottom: 4pt; }
  .tile-stat { flex: 1; }
  .tile-stat b { display: block; font-size: 10pt; font-weight: 700; }
  .tile-stat span {
    display: block; font-size: 6.5pt; letter-spacing: .6pt;
    text-transform: uppercase; color: var(--muted);
  }
  .tile svg { display: block; width: 100%; height: 30pt; }
  .spark-row { display: flex; align-items: center; gap: 5pt; }
  .spark-row svg { flex: 1 1 0%; min-width: 0; }
  .spark-end {
    font-size: 7.5pt; color: var(--muted); font-variant-numeric: tabular-nums;
    /* Level with the end point: report.py sets --dy = (end fraction - 0.5),
       in units of the sparkline's 30pt height. */
    transform: translateY(calc(var(--dy, 0) * 30pt));
  }
  .tile.gap-tile {
    background: #fff; border: 1pt dashed var(--gap-fg);
    border-top: 3pt dashed var(--gap-fg);
  }
  .tile.gap-tile .tile-lang { color: var(--gap-fg); }

  /* ---- pills: outlined tags, never a fill (they must print) ---- */
  .pill {
    display: inline-block; font-size: 7pt; font-weight: 700;
    letter-spacing: .5pt; text-transform: uppercase;
    padding: 1pt 6pt; border: 1pt solid currentColor;
    white-space: nowrap;
  }
  .pill-high { color: var(--up); }
  .pill-medium { color: #8a5b00; }
  .pill-low { color: var(--down); }
  .pill-gap { color: var(--gap-fg); font-style: italic; }

  /* ---- chart ---- */
  figure { margin: 0; }
  figure img { display: block; max-width: 100%; height: auto; }
  figure.gap { color: var(--gap-fg); font-style: italic; padding: 6pt 0; }
  figcaption {
    font-size: 7.5pt; color: var(--muted); margin-top: 4pt; text-align: left;
  }

  /* ---- table: rules only, no fills, bars behind Share/M ---- */
  table {
    width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-bottom: 10pt;
    font-variant-numeric: tabular-nums;
  }
  th, td { padding: 4pt 5pt; text-align: right; border-bottom: .5pt solid var(--rule); }
  th {
    color: var(--ink); font-weight: 700; font-size: 7.5pt;
    letter-spacing: .5pt; text-transform: uppercase;
    border-top: 1.2pt solid var(--ink); border-bottom: .75pt solid var(--ink);
  }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tbody tr:last-child td { border-bottom: 1pt solid var(--accent); }
  td.up { color: var(--up); font-weight: 600; }
  td.down { color: var(--down); font-weight: 600; }
  td.flat { color: var(--flat); }
  tr.gap-row td { color: var(--gap-fg); font-style: italic; background: var(--gap-bg); }
  td.bar-cell {
    background-image: linear-gradient(
      to right,
      var(--bar) calc(var(--w) * 100%),
      transparent calc(var(--w) * 100%)
    );
  }

  /* ---- caveats ---- */
  h2 {
    font-size: 9.5pt; margin: 0; color: var(--ink);
    text-transform: uppercase; letter-spacing: .8pt;
  }
  ul { margin: 0 0 8pt; padding-left: 15pt; }
  li { font-size: 8pt; color: #333333; margin-bottom: 3pt; }

  .note_block { margin-bottom: 8pt; }

  footer {
    margin-top: 10pt; padding: 7pt 14pt; border-top: 1pt solid var(--ink);
    font-size: 7.5pt; color: var(--muted);
  }

  .gap { color: var(--gap-fg); font-style: italic; }

  /* Print: white paper, no screen chrome. Nothing above *depends* on a
     background -- rules, borders and text carry every distinction, so a
     browser that drops background graphics still prints this report whole. */
  @media print {
    body { background: #fff; padding: 0; }
    .page { max-width: none; border: none; }
    .tile, figure, .verdict { break-inside: avoid; }
    tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">
<header>
  <div class="kicker">$kicker</div>
  <h1>$h1</h1>
  <div class="subtitle">$subtitle</div>
</header>

<main>
<div class="verdict">
  <div class="verdict-main">
    <span class="verdict-tag">$verdict_tag</span>
    <div class="verdict-text">$headline</div>
  </div>
  <div class="hero">$hero_block</div>
</div>

$kpi_block

$chart_block

$table_block

$heading_block

<ul>
$limitations
</ul>

$note_block
</main>

<footer>$footer</footer>
</div>
</body>
</html>
